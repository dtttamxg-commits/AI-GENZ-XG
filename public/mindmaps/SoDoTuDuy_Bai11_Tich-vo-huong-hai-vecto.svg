<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="centerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
    <pattern id="patternDots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.5" fill="#94a3b8" opacity="0.22" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1600" height="1050" fill="url(#bgGrad)" />
  <circle cx="180" cy="180" r="320" fill="#9333ea" opacity="0.04" />
  <circle cx="1420" cy="870" r="360" fill="#7c3aed" opacity="0.04" />
  <rect width="1600" height="1050" fill="url(#patternDots)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1560" height="1010" rx="24" fill="none" stroke="#ddd6fe" stroke-width="2" opacity="0.8" />

  <!-- TOP HEADER BANNER -->
  <g transform="translate(45, 36)">
    <rect width="1510" height="84" rx="20" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Chapter Tag Badge -->
    <rect x="24" y="20" width="136" height="44" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" />
    <text x="92" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#5b21b6" text-anchor="middle">
      Chương IV
    </text>

    <!-- Title & Subtitle -->
    <text x="180" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">
      Bài 11: Tích vô hướng của hai vectơ
    </text>
    <text x="180" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">
      Sơ đồ tư duy kiến thức cốt lõi · GDPT 2018 · Môn Toán 10 (Vectơ)
    </text>

    <!-- Right Badge: Standard GDPT 2018 -->
    <g transform="translate(1235, 22)">
      <rect width="250" height="40" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <circle cx="24" cy="20" r="7" fill="#10b981" />
      <text x="42" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">
        Sơ đồ tư duy chuẩn kiến thức
      </text>
    </g>
  </g>

  <!-- LEFT & RIGHT BRANCHES -->
  
      <!-- Left Branch 1 Connector -->
      <path d="M 635 525 C 620 525, 560 425, 460 425" fill="none" stroke="#9333ea" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="460" cy="425" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2" />

      <!-- Left Branch Card -->
      <g transform="translate(45, 350)">
        <!-- Card shadow & background -->
        <rect width="415" height="150" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#cardShadow)" />
        <rect x="0" y="0" width="415" height="42" rx="18" fill="#f5f3ff" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#f5f3ff" opacity="0.9" />
        
        <!-- Left color stripe -->
        <rect x="0" y="0" width="8" height="150" rx="4" fill="#7c3aed" />

        <!-- Card Header -->
        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#5b21b6">
          1. Góc Giữa Hai Vectơ
        </text>
        <g transform="translate(330, 10)">
          <rect width="70" height="22" rx="6" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1" />
          <text x="35" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">
            Góc
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#7c3aed" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Cho hai vectơ a và b khác 0. Từ O vẽ OA = a, OB = b....
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#7c3aed" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Hai vectơ cùng hướng: góc bằng 0°; ngược hướng: góc ...
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#7c3aed" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Hai vectơ vuông góc: (a, b) = 90° ⇔ a ⊥ b.
          </text>
        </g>
      
      </g>
    

      <!-- Left Branch 2 Connector -->
      <path d="M 635 525 C 620 525, 560 675, 460 675" fill="none" stroke="#9333ea" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="460" cy="675" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2" />

      <!-- Left Branch Card -->
      <g transform="translate(45, 589)">
        <!-- Card shadow & background -->
        <rect width="415" height="172" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#cardShadow)" />
        <rect x="0" y="0" width="415" height="42" rx="18" fill="#f5f3ff" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#f5f3ff" opacity="0.9" />
        
        <!-- Left color stripe -->
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#7c3aed" />

        <!-- Card Header -->
        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#5b21b6">
          2. Định Nghĩa Tích Vô Hướng
        </text>
        <g transform="translate(330, 10)">
          <rect width="70" height="22" rx="6" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1" />
          <text x="35" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">
            Định nghĩa
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#7c3aed" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Tích vô hướng của hai vectơ a và b là một SỐ THỰC, k...
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#7c3aed" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Công thức hình học: a · b = |a| · |b| · cos(a, b).
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#7c3aed" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Bình phương vô hướng: a² = a · a = |a|² (luôn ≥ 0).
          </text>
        </g>
      

        <g transform="translate(18, 142)">
          <circle cx="0" cy="0" r="4.5" fill="#7c3aed" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Điều kiện vuông góc: a ⊥ b ⇔ a · b = 0 (với a, b ≠ 0).
          </text>
        </g>
      
      </g>
    
  
      <!-- Right Branch 3 Connector -->
      <path d="M 965 525 C 980 525, 1040 425, 1140 425" fill="none" stroke="#9333ea" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="1140" cy="425" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2" />

      <!-- Right Branch Card -->
      <g transform="translate(1140, 339)">
        <!-- Card shadow & background -->
        <rect width="415" height="172" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#cardShadow)" />
        <rect x="0" y="0" width="415" height="42" rx="18" fill="#f5f3ff" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#f5f3ff" opacity="0.9" />
        
        <!-- Right color stripe -->
        <rect x="407" y="0" width="8" height="172" rx="4" fill="#9333ea" />

        <!-- Card Header -->
        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#5b21b6">
          3. Biểu Thức Tọa Độ Của Tích Vô Hướng
        </text>
        <g transform="translate(320, 10)">
          <rect width="80" height="22" rx="6" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1" />
          <text x="40" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">
            Tọa độ
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#9333ea" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Cho a = (x₁; y₁), b = (x₂; y₂): a · b = x₁·x₂ + y₁·y...
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#9333ea" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Độ dài: |a| = √(x₁² + y₁²).
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#9333ea" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Góc giữa hai vectơ: cos(a, b) = (x₁·x₂ + y₁·y₂) / [√...
          </text>
        </g>
      

        <g transform="translate(18, 142)">
          <circle cx="0" cy="0" r="4.5" fill="#9333ea" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Hai vectơ vuông góc: a ⊥ b ⇔ x₁·x₂ + y₁·y₂ = 0.
          </text>
        </g>
      
      </g>
    

      <!-- Right Branch 4 Connector -->
      <path d="M 965 525 C 980 525, 1040 675, 1140 675" fill="none" stroke="#9333ea" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="1140" cy="675" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2" />

      <!-- Right Branch Card -->
      <g transform="translate(1140, 600)">
        <!-- Card shadow & background -->
        <rect width="415" height="150" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#cardShadow)" />
        <rect x="0" y="0" width="415" height="42" rx="18" fill="#f5f3ff" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#f5f3ff" opacity="0.9" />
        
        <!-- Right color stripe -->
        <rect x="407" y="0" width="8" height="150" rx="4" fill="#9333ea" />

        <!-- Card Header -->
        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#5b21b6">
          4. Tính Chất &amp; Ứng Dụng Vật Lý
        </text>
        <g transform="translate(320, 10)">
          <rect width="80" height="22" rx="6" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1" />
          <text x="40" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">
            Ứng dụng
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#9333ea" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Giao hoán: a · b = b · a; Phân phối: a · (b + c) = a...
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#9333ea" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Công cơ học trong Vật lý: A = F · s = |F| · |s| · cosα.
          </text>
        </g>
      
      </g>
    

  <!-- CENTER CORE HUB (TÂM SƠ ĐỒ) -->
  <g transform="translate(800, 525)">
    <!-- Glowing pulse rings -->
    <circle cx="0" cy="0" r="175" fill="#7c3aed" opacity="0.06" />
    <circle cx="0" cy="0" r="150" fill="#9333ea" opacity="0.1" />
    <circle cx="0" cy="0" r="125" fill="#9333ea" opacity="0.15" />

    <!-- Center Card Box -->
    <rect x="-155" y="-95" width="310" height="190" rx="30" fill="url(#centerGrad)" filter="url(#centerShadow)" stroke="#ffffff" stroke-width="3" />
    
    <!-- Center text elements -->
    <text x="0" y="-45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" opacity="0.9" text-anchor="middle" letter-spacing="1.5">
      TRỌNG TÂM KIẾN THỨC
    </text>
    <text x="0" y="-12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">
