    </filter>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <pattern id="patternDots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.5" fill="#94a3b8" opacity="0.22" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1600" height="1050" fill="url(#bgGrad)" />
  <circle cx="180" cy="180" r="320" fill="#4f46e5" opacity="0.04" />
  <circle cx="1420" cy="870" r="360" fill="#2563eb" opacity="0.04" />
  <rect width="1600" height="1050" fill="url(#patternDots)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1560" height="1010" rx="24" fill="none" stroke="#bfdbfe" stroke-width="2" opacity="0.8" />

  <!-- TOP HEADER BANNER -->
  <g transform="translate(45, 36)">
    <rect width="1510" height="84" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Chapter Tag Badge -->
