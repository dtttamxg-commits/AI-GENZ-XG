    </text>
  </g>

  <!-- BOTTOM HIGHLIGHTS FOOTER -->
  <g transform="translate(45, 974)">
    <rect width="1510" height="48" rx="14" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="24" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#9f1239">
      ĐIỂM NHẤN CỐT LÕI:
    </text>
    <text x="175" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#475569">
      Δ &lt; 0: f(x) cùng dấu với a với mọi x ∈ R   •   Δ &gt; 0: Quy tắc &quot;Trong trái, ngoài cùng&quot;   •   Điều kiện f(x) &gt; 0 ∀x ∈ R: a &gt; 0 và Δ &lt; 0
    </text>
  </g>
</svg>