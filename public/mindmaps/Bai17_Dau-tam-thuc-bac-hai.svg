          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#e11d48" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Biểu thức dạng f(x) = ax² + bx + c (a ≠ 0).
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#e11d48" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Nghiệm của tam thức là nghiệm của phương trình ax² +...
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#e11d48" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Biệt thức Δ = b² - 4ac.
          </text>
        </g>
      
      </g>
    

      <!-- Left Branch 2 Connector -->
      <path d="M 635 525 C 620 525, 560 675, 460 675" fill="none" stroke="#db2777" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="460" cy="675" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2" />

      <!-- Left Branch Card -->
      <g transform="translate(45, 589)">
        <!-- Card shadow & background -->
        <rect width="415" height="172" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2" filter="url(#cardShadow)" />
        <rect x="0" y="0" width="415" height="42" rx="18" fill="#fff1f2" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#fff1f2" opacity="0.9" />
        
        <!-- Left color stripe -->
        <rect x="0" y="0" width="8" height="172" rx="4" fill="#e11d48" />

        <!-- Card Header -->
        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#9f1239">
          2. Định Lý Về Dấu Của Tam Thức Bậc Hai
        </text>
        <g transform="translate(330, 10)">
          <rect width="70" height="22" rx="6" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1" />
          <text x="35" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">
            Định lý cốt lõi
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#e11d48" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            TH1 (Δ &lt; 0): f(x) CÙNG DẤU VỚI HỆ SỐ a với MỌI x ...
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#e11d48" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            TH2 (Δ = 0): f(x) CÙNG DẤU VỚI a với mọi x ≠ -b/(2a)...
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#e11d48" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            TH3 (Δ &gt; 0): Phương trình có 2 nghiệm x₁ &lt; x₂.
          </text>
        </g>
      

        <g transform="translate(18, 142)">
          <circle cx="0" cy="0" r="4.5" fill="#e11d48" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            ➔ &quot;Trong trái, ngoài cùng&quot;: f(x) TRÁI DẤU ...
          </text>
        </g>
      
      </g>
    
  
      <!-- Right Branch 3 Connector -->
      <path d="M 965 525 C 980 525, 1040 425, 1140 425" fill="none" stroke="#db2777" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="1140" cy="425" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2" />

