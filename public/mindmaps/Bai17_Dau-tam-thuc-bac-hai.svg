        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Dạng: ax² + bx + c &gt; 0 (hoặc ≥ 0, &lt; 0, ≤ 0) vớ...
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Quy trình giải: Tính Δ ➔ Tìm nghiệm ➔ Lập bảng xét d...
          </text>
        </g>
      
      </g>
    

      <!-- Right Branch 4 Connector -->
      <path d="M 965 525 C 980 525, 1040 675, 1140 675" fill="none" stroke="#db2777" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="1140" cy="675" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2" />

      <!-- Right Branch Card -->
      <g transform="translate(1140, 589)">
        <!-- Card shadow & background -->
        <rect width="415" height="172" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2" filter="url(#cardShadow)" />
        <rect x="0" y="0" width="415" height="42" rx="18" fill="#fff1f2" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#fff1f2" opacity="0.9" />
        
        <!-- Right color stripe -->
        <rect x="407" y="0" width="8" height="172" rx="4" fill="#db2777" />

        <!-- Card Header -->
        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#9f1239">
          4. Điều Kiện Để f(x) Không Đổi Dấu Trên R
        </text>
        <g transform="translate(320, 10)">
          <rect width="80" height="22" rx="6" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1" />
          <text x="40" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">
            Tham số m
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            f(x) &gt; 0 với mọi x ∈ R ⇔ a &gt; 0 và Δ &lt; 0.
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            f(x) ≥ 0 với mọi x ∈ R ⇔ a &gt; 0 và Δ ≤ 0.
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            f(x) &lt; 0 với mọi x ∈ R ⇔ a &lt; 0 và Δ &lt; 0.
          </text>
        </g>
      

        <g transform="translate(18, 142)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            f(x) ≤ 0 với mọi x ∈ R ⇔ a &lt; 0 và Δ ≤ 0.
          </text>
        </g>
      
      </g>
    

  <!-- CENTER CORE HUB (TÂM SƠ ĐỒ) -->
  <g transform="translate(800, 525)">
    <!-- Glowing pulse rings -->
    <circle cx="0" cy="0" r="175" fill="#e11d48" opacity="0.06" />
    <circle cx="0" cy="0" r="150" fill="#db2777" opacity="0.1" />
