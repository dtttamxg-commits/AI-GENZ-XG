        </text>
        <g transform="translate(320, 10)">
          <rect width="80" height="22" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1" />
          <text x="40" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">
            Hình học
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#10b981" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Tam giác vuông: a² = b² + c² hoặc sin²A = sin²B + si...
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#10b981" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Tam giác cân: b = c hoặc sinB = sinC.
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#10b981" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Tam giác đều: a = b = c hoặc cosA + cosB + cosC = 3/2.
          </text>
        </g>
      
      </g>
    

      <!-- Right Branch 4 Connector -->
