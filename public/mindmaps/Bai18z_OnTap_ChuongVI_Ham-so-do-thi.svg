        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            √(f) = √(g) ➔ Bình phương ➔ Thử lại.
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            √(f) = g ➔ Điều kiện g ≥ 0 ➔ Bình phương ➔ Giải hệ.
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#db2777" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Đặt ẩn phụ: Tìm đại lượng chung t = √(biểu thức).
          </text>
        </g>
      
      </g>
    

      <!-- Right Branch 4 Connector -->
      <path d="M 965 525 C 980 525, 1040 675, 1140 675" fill="none" stroke="#db2777" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="1140" cy="675" r="7" fill="#e11d48" stroke="#ffffff" stroke-width="2" />

      <!-- Right Branch Card -->
