<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="centerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <pattern id="patternDots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.5" fill="#94a3b8" opacity="0.22" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1600" height="1050" fill="url(#bgGrad)" />
  <circle cx="180" cy="180" r="320" fill="#4f46e5" opacity="0.04" />
  <circle cx="1420" cy="870" r="360" fill="#2563eb" opacity="0.04" />
  <rect width="1600" height="1050" fill="url(#patternDots)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1560" height="1010" rx="24" fill="none" stroke="#bfdbfe" stroke-width="2" opacity="0.8" />

  <!-- TOP HEADER BANNER -->
  <g transform="translate(45, 36)">
    <rect width="1510" height="84" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Chapter Tag Badge -->
    <rect x="24" y="20" width="136" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="92" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e40af" text-anchor="middle">
      Chương VII
    </text>

    <!-- Title & Subtitle -->
    <text x="180" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#0f172a">
      Ôn tập Chương VII: Phương pháp tọa độ trong mặt phẳng
    </text>
    <text x="180" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b">
      Sơ đồ tư duy kiến thức cốt lõi · GDPT 2018 · Môn Toán 10 (Phương pháp tọa độ trong mặt phẳng)
    </text>

    <!-- Right Badge: Standard GDPT 2018 -->
    <g transform="translate(1235, 22)">
      <rect width="250" height="40" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <circle cx="24" cy="20" r="7" fill="#10b981" />
      <text x="42" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">
        Sơ đồ tư duy chuẩn kiến thức
      </text>
    </g>
  </g>

  <!-- LEFT & RIGHT BRANCHES -->
  
      <!-- Left Branch 1 Connector -->
      <path d="M 635 525 C 620 525, 560 425, 460 425" fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="460" cy="425" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2" />

      <!-- Left Branch Card -->
