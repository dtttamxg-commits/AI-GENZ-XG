        <rect x="0" y="0" width="415" height="42" rx="18" fill="#eff6ff" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#eff6ff" opacity="0.9" />
        
        <!-- Right color stripe -->
