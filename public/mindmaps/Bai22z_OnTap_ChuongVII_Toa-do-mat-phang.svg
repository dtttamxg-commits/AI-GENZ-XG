        <rect x="0" y="0" width="415" height="42" rx="18" fill="#eff6ff" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#eff6ff" opacity="0.9" />
        
        <!-- Right color stripe -->
        <rect x="407" y="0" width="8" height="150" rx="4" fill="#4f46e5" />

        <!-- Card Header -->
        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">
          3. Bảng So Sánh 3 Đường Conic
        </text>
        <g transform="translate(320, 10)">
          <rect width="80" height="22" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1" />
          <text x="40" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">
            Ba Conic
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#4f46e5" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Elip: x²/a² + y²/b² = 1 (a² = b² + c²).
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#4f46e5" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Hypebol: x²/a² - y²/b² = 1 (c² = a² + b²).
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#4f46e5" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Parabol: y² = 2px (F(p/2; 0), đường chuẩn x = -p/2).
          </text>
        </g>
      
      </g>
    

      <!-- Right Branch 4 Connector -->
      <path d="M 965 525 C 980 525, 1040 675, 1140 675" fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="1140" cy="675" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2" />

      <!-- Right Branch Card -->
