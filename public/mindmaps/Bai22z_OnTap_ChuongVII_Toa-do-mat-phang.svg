          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#4f46e5" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Lập phương trình Conic khi biết các yếu tố hình học.
          </text>
        </g>
      
      </g>
    

  <!-- CENTER CORE HUB (TÂM SƠ ĐỒ) -->
  <g transform="translate(800, 525)">
    <!-- Glowing pulse rings -->
    <circle cx="0" cy="0" r="175" fill="#2563eb" opacity="0.06" />
    <circle cx="0" cy="0" r="150" fill="#4f46e5" opacity="0.1" />
