        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">
          1. Hệ Thống Phương Trình Đường Thẳng
        </text>
        <g transform="translate(330, 10)">
          <rect width="70" height="22" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1" />
          <text x="35" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">
            Đường thẳng
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#2563eb" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Tham số: { x = x₀ + at; y = y₀ + bt } · Tổng quát: a...
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#2563eb" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Góc: cosφ = |a₁a₂ + b₁b₂| / [√(a₁²+b₁²)√(a₂²+b₂²)].
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#2563eb" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Khoảng cách: d(M, Δ) = |ax₀ + by₀ + c| / √(a² + b²).
          </text>
        </g>
      
      </g>
    

      <!-- Left Branch 2 Connector -->
      <path d="M 635 525 C 620 525, 560 675, 460 675" fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="460" cy="675" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2" />

      <!-- Left Branch Card -->
      <g transform="translate(45, 600)">
        <!-- Card shadow & background -->
        <rect width="415" height="150" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#cardShadow)" />
        <rect x="0" y="0" width="415" height="42" rx="18" fill="#eff6ff" opacity="0.9" />
        <rect x="0" y="24" width="415" height="18" fill="#eff6ff" opacity="0.9" />
        
        <!-- Left color stripe -->
        <rect x="0" y="0" width="8" height="150" rx="4" fill="#2563eb" />

        <!-- Card Header -->
        <text x="20" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">
          2. Phương Trình Đường Tròn
        </text>
        <g transform="translate(330, 10)">
          <rect width="70" height="22" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1" />
          <text x="35" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">
            Đường tròn
          </text>
        </g>

        <!-- Points list -->
        
        <g transform="translate(18, 58)">
          <circle cx="0" cy="0" r="4.5" fill="#2563eb" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            (x - a)² + (y - b)² = R² ⇔ x² + y² - 2ax - 2by + c =...
          </text>
        </g>
      

        <g transform="translate(18, 86)">
          <circle cx="0" cy="0" r="4.5" fill="#2563eb" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Tiếp tuyến tại M₀: (x₀ - a)(x - x₀) + (y₀ - b)(y - y...
          </text>
        </g>
      

        <g transform="translate(18, 114)">
          <circle cx="0" cy="0" r="4.5" fill="#2563eb" />
          <text x="12" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#334155">
            Vị trí tương đối với đường thẳng dựa vào d(I, Δ) so ...
          </text>
        </g>
      
      </g>
    
  
      <!-- Right Branch 3 Connector -->
      <path d="M 965 525 C 980 525, 1040 425, 1140 425" fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="1140" cy="425" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2" />

      <!-- Right Branch Card -->
      <g transform="translate(1140, 350)">
